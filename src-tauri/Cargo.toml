[package]
name = "lados"
version = "0.2.1"
description = "Lados: a fast, secure and offline password manager"
authors = ["Adrià Junquera"]
license = "GPL-3.0-only"
edition = "2024"
rust-version = "1.90"

[lib]
# The library name differs from the binary name to avoid a PDB file name clash on Windows.
# staticlib/cdylib are required for Android / iOS embedding.
name = "lados_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[features]
# Enabled by `tauri build` for production: embeds the frontend instead of using
# the dev server. A plain `cargo build --release` must pass it explicitly, or the
# app will try to reach the Vite dev URL at runtime.
custom-protocol = ["tauri/custom-protocol"]
# Optional cloud synchronization (see docs/SYNC.md). Off by default so normal builds
# are unchanged while the feature is developed.
sync = ["dep:reqwest"]

[dependencies]
# Shared shell (tray-icon is desktop-only; see target-specific deps below)
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-fs = "2.7"
tauri-plugin-clipboard-manager = "2.5"
tauri-plugin-opener = "2.7"

# Data model and serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"

# Cryptography
argon2 = { version = "0.6", default-features = false, features = ["alloc", "parallel", "zeroize"] }
chacha20poly1305 = { version = "0.11", features = ["zeroize"] }
sha2 = "0.11"
rand = "0.10"
zeroize = { version = "1.9", features = ["derive"] }

# Import / export
csv = "1.4"
keepass = { version = "0.15", features = ["save_kdbx4"] }
base64 = "0.23"

# Optional sync client (only compiled with the `sync` feature).
reqwest = { version = "0.13", optional = true, default-features = false, features = ["blocking", "json", "rustls"] }

[dev-dependencies]
tempfile = "3"

# Key derivation is intentionally slow; without optimizations it becomes unbearable in debug builds.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.rust-argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.dev.package.aes]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.chacha20]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
# "symbols" would strip JNI exports and break the Android .so at startup.
strip = "debuginfo"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-updater = "2.14"
tauri-plugin-process = "2.4"
# Browser-extension integration: the `lados://` scheme launches/focusses the app,
# and a second launch is forwarded to the running instance instead of opening twice.
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
