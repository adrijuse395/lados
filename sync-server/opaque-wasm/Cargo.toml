[package]
name = "lados-opaque"
version = "0.1.0"
edition = "2021"
description = "OPAQUE server, compiled to WebAssembly for the Lados Sync worker."
license = "AGPL-3.0-only"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
opaque-ke = { version = "4", features = ["ristretto255"] }
sha2 = "0.10"
rand_chacha = "0.3"
base64 = "0.22"
serde_json = "1"
wasm-bindgen = "0.2"

[profile.release]
opt-level = "s"
lto = true
