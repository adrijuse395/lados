# Lados Sync server — Cloudflare Worker configuration.
# Docs: https://developers.cloudflare.com/workers/wrangler/configuration/

name = "lados-sync"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# D1 database (accounts, sessions, vault versions).
# Create it with:  wrangler d1 create lados-sync
# then paste the returned database_id here.
[[d1_databases]]
binding = "DB"
database_name = "lados-sync"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# R2 bucket (encrypted vault blobs).
# Create it with:  wrangler r2 bucket create lados-sync-blobs
[[r2_buckets]]
binding = "BLOBS"
bucket_name = "lados-sync-blobs"

[vars]
TOKEN_TTL_SECONDS = "2592000"   # 30 days
