name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Test
        run: cargo test --features sync

      - name: Clippy
        run: cargo clippy --all-targets --features sync -- -D warnings

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

  text:
    name: Text
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # The sources are UTF-8. A tool that reads and writes them through a legacy codepage (Windows
      # PowerShell's Get-Content/Set-Content, for one) turns every em-dash and curly quote into
      # mojibake, which then ships inside user-visible strings. Catch it here, not in review.
      - name: No mojibake in the sources
        run: |
          bad=0
          # The pattern is written as hex escapes so this line cannot match itself.
          if git grep -I -n -P '\xc3\xa2\xe2\x82\xac' -- . ':!package-lock.json'; then
            echo "::error::A file was re-encoded through a legacy codepage. Rewrite it as UTF-8."
            bad=1
          fi
          # U+FFFD in source is never meaningful: it means a character was lost in translation.
          if git grep -I -n -P '\xef\xbf\xbd' -- . ':!package-lock.json'; then
            echo "::error::A replacement character (U+FFFD) was written into a source file."
            bad=1
          fi
          [ $bad -eq 0 ] && echo "Looks clean."
          exit $bad

  extension:
    name: Extension
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Uses the same addons-linter engine as addons.mozilla.org, so AMO
      # rejections (innerHTML, missing data_collection_permissions, icon sizes…)
      # are caught here instead of at upload time.
      - name: Lint the Firefox extension
        run: npx --yes web-ext lint --source-dir browser-extension

  sync-server:
    name: Sync server
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: sync-server
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sync-server/package-lock.json

      - run: npm ci

      - run: npm run typecheck
