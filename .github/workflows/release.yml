name: Release

# Build installers for Windows, macOS, and Linux when a version tag is pushed.
# Example:
#   git tag -a v0.1.2 -m "Release v0.1.2"
#   git push origin v0.1.2
#
# Requires repository secrets:
#   TAURI_SIGNING_PRIVATE_KEY          — minisign private key (file contents)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD — optional; empty if the key has no password
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Create one draft up front so matrix jobs do not race into duplicate releases.
  create-release:
    name: Create draft release
    runs-on: ubuntu-24.04
    outputs:
      release_id: ${{ steps.draft.outputs.id }}
    steps:
      - id: draft
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Lados ${{ github.ref_name }}
          draft: true
          prerelease: false
          body: |
            Offline-first password manager for Windows, macOS, and Linux.

            Download the asset for your platform below. Build from source if you want to verify the binary against this tag.

  publish:
    name: Build (${{ matrix.name }})
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            platform: windows-latest
            args: ""
          - name: linux
            platform: ubuntu-22.04
            args: ""
          - name: macos-aarch64
            platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - name: macos-x86_64
            platform: macos-latest
            args: "--target x86_64-apple-darwin"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and upload
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}
