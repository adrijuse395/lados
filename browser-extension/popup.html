<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Lados</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        width: 260px;
        padding: 14px;
        font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
        color: #111418;
        background: #f4f5f7;
      }
      .head {
        display: flex;
        align-items: center;
        gap: 9px;
        margin-bottom: 10px;
      }
      .logo {
        width: 26px;
        height: 26px;
        flex: 0 0 auto;
        color: #111418;
      }
      h1 {
        margin: 0;
        font-size: 15px;
      }
      .sub {
        margin: 0;
        font-size: 11.5px;
        color: #5c6570;
      }
      #status {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 9px 11px;
        border-radius: 9px;
        background: #fff;
        border: 1px solid #d8dde3;
      }
      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        flex: 0 0 auto;
        background: #9aa4b2;
      }
      .ok .dot {
        background: #2e9e5b;
      }
      .warn .dot {
        background: #d99a2b;
      }
      .off .dot {
        background: #cf5b5b;
      }
      #msg {
        flex: 1;
      }
      button {
        margin-top: 10px;
        width: 100%;
        padding: 9px 12px;
        border: 0;
        border-radius: 9px;
        background: #111418;
        color: #f4f5f7;
        font: 600 13px/1 system-ui, sans-serif;
        cursor: pointer;
      }
      button:hover {
        background: #1c2129;
      }
      button[hidden] {
        display: none;
      }
      footer {
        margin-top: 10px;
        font-size: 11px;
        color: #5c6570;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #111418;
          color: #f4f5f7;
        }
        .logo {
          color: #f4f5f7;
        }
        .sub,
        footer {
          color: #9aa4b2;
        }
        #status {
          background: #161a21;
          border-color: #2a2f38;
        }
        button {
          background: #f4f5f7;
          color: #111418;
        }
        button:hover {
          background: #d9dde3;
        }
      }
    </style>
  </head>
  <body>
    <div class="head">
      <span class="logo">
        <svg viewBox="0 0 24 24" width="100%" height="100%" fill="currentColor" aria-hidden="true">
          <path d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5l-8-3zm0 3.2 4.8 1.8v4c0 3.3-2 6.5-4.8 7.8-2.8-1.3-4.8-4.5-4.8-7.8v-4L12 5.2z"/>
        </svg>
      </span>
      <div>
        <h1>Lados</h1>
        <p class="sub">Fill logins from your local vault.</p>
      </div>
    </div>
    <div id="status">
      <span class="dot"></span>
      <span id="msg">Checking…</span>
    </div>
    <button id="open" hidden>Open Lados</button>
    <footer>Your vault never leaves this computer.</footer>
    <script src="popup.js"></script>
  </body>
</html>
